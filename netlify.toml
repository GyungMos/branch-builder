[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"

# SPA 라우팅을 위한 리다이렉트 설정
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 노션 연결 프로그램 (netlify/functions/notion-sync.mjs → /.netlify/functions/notion-sync)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
