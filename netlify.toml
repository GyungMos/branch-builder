[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"

# 배치도 3D 화면이 저장소(Storage)의 3D 모델·사진을 같은 사이트 주소로 읽게 (브라우저의 다른 주소 막기(CORS) 피하기)
# 우리 저장소(.env 의 VITE_FIREBASE_STORAGE_BUCKET)의 파일 내려받기 주소만 통과
[[redirects]]
  from = "/fbfiles/v0/b/pw-archi.firebasestorage.app/o/:object"
  to = "https://firebasestorage.googleapis.com/v0/b/pw-archi.firebasestorage.app/o/:object"
  status = 200
  force = true

# SPA 라우팅을 위한 리다이렉트 설정
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 노션 연결 프로그램 (netlify/functions/notion-sync.mjs → /.netlify/functions/notion-sync)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
